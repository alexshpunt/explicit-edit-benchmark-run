---
# yamllint disable rule:line-length
name: Resubmit existing official result

"on":
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Original Run official benchmark workflow run id
        required: true
        type: string
      producer_attempt:
        description: Original workflow attempt
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  submit:
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-submit.yml@6b39eca986e78f28758070ce7a0b343be58271b0
    with:
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
      signer_sha: be568216c66a22149a1d869724ee3f2891b70988
      policy_sha: 6b39eca986e78f28758070ce7a0b343be58271b0
      dataset_repository: alexshpunt/explicit-edit-benchmark
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
